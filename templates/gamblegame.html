<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WITCH'S GAMBLE</title>
</head>
<body style="background-color: #111827; color: #9ca3af">
    <div style="display: flex;">
        <h1 style="font-size: 3vw; flex: 1;"><b>THE WITCH'S GAMBLE</b></h1>
        <h2 style="text-align: right; flex: 1; font-size: 3vw;"><a href="/route">EXIT</a></h2>
    </div>
    <hr>
    <form action="/gamblegame" method="post">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8vh; width: 70%; justify-content: center; margin: auto; margin-top: 2vw;">
        <button type="submit" name="box" value="1">
        <div style="font-size: 2vw; text-align: center; cursor: pointer; padding: 7vh 5vh;">
            <p>Box 1</p>
        </div>
        </button>
        <button type="submit" name="box" value="2">
        <div style="font-size: 2vw; text-align: center; cursor: pointer; padding: 7vh 5vh;">
            <p>Box 2</p>
        </div>
        </button>
        <button type="submit" name="box" value="3">
        <div style="font-size: 2vw; text-align: center; cursor: pointer; padding: 7vh 5vh;">
            <p>Box 3</p>
        </div>
        </button>
        <button type="submit" name="box" value="4">
        <div style="font-size: 2vw; text-align: center; cursor: pointer; padding: 7vh 5vh;">
            <p>Box 4</p>
        </div>
        </button>
    </div>
    <hr>
    <p style="text-align: center;"><button type="submit" name="cashout" value="True" style="text-align: center; font-size: 3vw;">Cash Out</button></p>
    </form>
</body>
